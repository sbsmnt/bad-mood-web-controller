<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3eeea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141516" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="A browser-based MIDI editor for the Chase Bliss BAD MOOD pedal." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BAD MOOD" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>CBA BAD MOOD Editor</title>
    <script>
      // Apply the saved pedal finish before first paint to avoid a theme flash.
      (() => {
        var theme
        try { theme = localStorage.getItem('bad-mood:theme') } catch {}
        if (theme !== 'pink' && theme !== 'grey') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'grey' : 'pink'
        }
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme === 'grey' ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
